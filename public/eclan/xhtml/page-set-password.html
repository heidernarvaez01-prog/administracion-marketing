<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Title -->
	<title>Elegir contraseña - Apache 360</title>

	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="robots" content="noindex, nofollow">
	<meta name="format-detection" content="telephone=no">

	<!-- Mobile Specific -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Favicon icon -->
	<link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">

</head>

<body>
    <div class="fix-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-6">
                    <div class="card mb-0 h-auto">
                        <div class="card-body">
                            <div class="text-center mb-3">
                                <a href="page-login.html"><span class="brand-title" style="font-size:34px;font-weight:700;color:#000;white-space:nowrap;">Apache 360</span></a>
                            </div>

                            <!-- Estado: verificando el link de invitación/recuperación -->
                            <div id="spVerifying" class="text-center py-3">
                                <div class="spinner-border text-primary mb-3" role="status"></div>
                                <p class="text-muted mb-0">Verificando tu link…</p>
                            </div>

                            <!-- Estado: link inválido o expirado -->
                            <div id="spError" class="d-none text-center">
                                <i class="la la-exclamation-triangle text-danger" style="font-size: 40px;"></i>
                                <h4 class="mt-3 mb-2">Link no válido</h4>
                                <p id="spErrorMsg" class="text-muted"></p>
                                <p class="fs-13 text-muted">El link puede haber expirado o ya fue usado. Pídele a un administrador que te reenvíe la invitación.</p>
                                <a href="page-login.html" class="btn btn-primary mt-2">Ir a iniciar sesión</a>
                            </div>

                            <!-- Estado: contraseña guardada -->
                            <div id="spSaved" class="d-none text-center py-3">
                                <i class="la la-check-circle text-success" style="font-size: 40px;"></i>
                                <p class="mt-3 mb-0 fw-bold">Contraseña guardada</p>
                                <p class="text-muted fs-13">Entrando a tu panel…</p>
                            </div>

                            <!-- Estado: formulario para elegir contraseña -->
                            <form id="spForm" class="d-none">
                                <h4 class="text-center mb-1">Elige tu contraseña</h4>
                                <p class="text-center text-muted fs-13 mb-4">Esto activa tu cuenta de Apache 360.</p>
                                <div id="spFormError" class="alert alert-danger py-2 px-3 d-none" role="alert"></div>
                                <div class="form-group">
                                    <label class="form-label" for="spPassword">Nueva contraseña</label>
                                    <input type="password" id="spPassword" class="form-control" placeholder="Mínimo 8 caracteres" required autocomplete="new-password">
                                </div>
                                <div class="mb-sm-4 mb-3">
                                    <label class="form-label" for="spConfirm">Confirmar contraseña</label>
                                    <input type="password" id="spConfirm" class="form-control" required autocomplete="new-password">
                                </div>
                                <div class="text-center">
                                    <button type="submit" id="spSubmit" class="btn btn-primary btn-block">Guardar y entrar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <!--**********************************
        Scripts
    ***********************************-->
    <!-- Required vendors -->
    <script src="vendor/global/global.min.js"></script>
	<script src="vendor/bootstrap-select/dist/js/bootstrap-select.min.js"></script>
    <script src="js/custom.min.js"></script>
    <script src="js/deznav-init.js"></script>

    <!-- Procesa el link de invitación/recuperación contra Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
    <script src="js/dashboard/supabase-client.js"></script>
    <script src="js/dashboard/page-set-password.js"></script>

</body>

</html>
