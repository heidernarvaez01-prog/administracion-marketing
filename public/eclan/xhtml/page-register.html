<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Title -->
	<title>Eclan - Ads Campaign Admin Dashboard Template</title>

	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="author" content="DexignZone">
	<meta name="robots" content="">

	<meta name="keywords" content="admin dashboard, admin template, admin themes, ads admin, analytics, bootstrap, bootstrap 5, bootstrap 5 admin template, modern, responsive admin dashboard, sales dashboard, sass, ui kit, web app">
	<meta name="description" content="Discover seamless ad campaign management with Eclan - the ultimate Ads Campaign Admin Dashboard Template. Streamline your advertising efforts, analyze performance, and optimize campaigns effortlessly. Take control of your advertising success today!">

	<meta property="og:title" content="Eclan - Ads Campaign Admin Dashboard Template">
	<meta property="og:description" content="Discover seamless ad campaign management with Eclan - the ultimate Ads Campaign Admin Dashboard Template. Streamline your advertising efforts, analyze performance, and optimize campaigns effortlessly. Take control of your advertising success today!">
	<meta property="og:image" content="https://eclan.dexignzone.com/xhtml/social-image.png">
	<meta name="format-detection" content="telephone=no">

	<!-- Mobile Specific -->
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<!-- Favicon icon -->
	<link rel="icon" type="image/png" sizes="16x16" href="images/favicon.png">
    <link href="css/style.css" rel="stylesheet">

</head>

<body>
    <div class="fix-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-6">
                    <div class="card mb-0 h-auto">
                        <div class="card-body">
                            <div class="text-center mb-3">
                                <a href="index.html"><img class="logo-auth" src="images/logo-full.png" alt=""></a>
                            </div>
                            <h4 class="text-center mb-4">Crear cuenta</h4>
                            <div id="register-error" class="alert alert-danger py-2 px-3 d-none" role="alert"></div>
                            <div id="register-success" class="alert alert-success py-2 px-3 d-none" role="alert"></div>
                            <form id="register-form">
                                <div class="form-group">
                                    <label class="form-label" for="email">Correo</label>
                                    <input type="email" class="form-control" placeholder="tu@correo.com" id="email" required autocomplete="username">
                                </div>
                                <div class="mb-sm-4 mb-3 position-relative">
                                    <label class="form-label" for="dz-password">Contraseña</label>
                                    <input type="password" id="dz-password" class="form-control" required minlength="6" autocomplete="new-password">
                                    <span class="show-pass eye">
                                        <i class="fa fa-eye-slash"></i>
                                        <i class="fa fa-eye"></i>
                                    </span>
                                </div>
                                <div class="text-center">
                                    <button type="submit" id="register-submit" class="btn btn-primary btn-block">Crear cuenta</button>
                                </div>
                            </form>
                            <div class="new-account mt-3">
                                <p>¿Ya tienes cuenta? <a class="text-primary" href="page-login.html">Inicia sesión</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<!--**********************************
	Scripts
***********************************-->
<!-- Required vendors -->
<script src="vendor/global/global.min.js"></script>
<script src="vendor/bootstrap-select/dist/js/bootstrap-select.min.js"></script>
<script src="js/custom.min.js"></script>
<script src="js/deznav-init.js"></script>

<!-- Registro real contra Supabase Auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="js/dashboard/supabase-client.js"></script>
<script src="js/dashboard/register.js"></script>

</body>
</html>
